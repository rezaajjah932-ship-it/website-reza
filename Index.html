<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIAP</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111;
      font-family: Arial, sans-serif;
    }

    h1 {
      color: white;
      font-size: 100px;
      letter-spacing: 15px;
      text-shadow: 0 0 20px #00ffff;
      animation: menyala 1.5s infinite alternate;
    }

    @keyframes menyala {
      from {
        transform: scale(1);
        opacity: 0.7;
      }

      to {
        transform: scale(1.1);
        opacity: 1;
      }
    }
  </style>
</head>

<body>

  <h1>SIAP</h1>

</body>
</html>
